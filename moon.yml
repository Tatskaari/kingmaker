toolchains:
  default: node
tasks:
  typecheck:
    command: npx --no-install tsc --noEmit
    deps: [contracts:generate]
    inputs: ['packages/**/*', 'apps/**/*', 'tests/**/*', 'scripts/**/*', 'tsconfig.json', 'package.json', 'package-lock.json']
  test:
    command: node --experimental-ffi --import tsx --import ./scripts/test-logging.ts --test tests/*.test.ts
    options:
      cache: false
    deps: [contracts:generate]
    inputs: ['packages/**/*', 'apps/**/*', 'tests/**/*', 'scripts/**/*', 'content/**/*', 'lore/**/*', 'package.json', 'package-lock.json']
  compile:
    command: npx --no-install tsc --outDir dist
    deps: [contracts:generate]
    inputs: ['packages/**/*', 'apps/**/*', 'tests/**/*', 'scripts/**/*', 'tsconfig.json', 'package.json', 'package-lock.json']
    outputs: [dist]
  webBuild:
    deps: [contracts:generate]
    command: npx --no-install vite build
    inputs: ['apps/web/**/*', 'packages/**/*', 'content/**/*', 'vite.config.ts', 'package.json', 'package-lock.json']
    outputs: ['dist/web']
  build:
    deps: [compile, webBuild]
  check:
    deps: [contracts:lint, typecheck, test]
  dev:
    command: npx --no-install vite
    deps: [contracts:generate]
    inputs: ['apps/**/*', 'packages/**/*', 'content/**/*', 'package.json', 'package-lock.json']
    options:
      cache: false
      persistent: true
