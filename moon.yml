toolchains:
  default: node
tasks:
  evalReview:
    command: npx --no-install tsx scripts/run-conversation-review-eval.ts
    deps: [contracts:generate]
    options:
      cache: false
  evalGift:
    command: npx --no-install tsx scripts/run-peregrine-gift-eval.ts
    deps: [contracts:generate]
    options:
      cache: false
  evalAttention:
    command: npx --no-install tsx scripts/run-attention-eval.ts
    deps: [contracts:generate]
    options:
      cache: false
  evalNavigation:
    command: npx --no-install tsx scripts/run-navigation-eval.ts
    deps: [contracts:generate]
    options:
      cache: false
  evalCorvinReview:
    command: npx --no-install tsx scripts/run-corvin-inquiry-eval.ts
    deps: [contracts:generate]
    options:
      cache: false
  evalCorvinPlanner:
    command: npx --no-install tsx scripts/run-corvin-planner-eval.ts
    deps: [contracts:generate]
    options:
      cache: false
  eval:
    deps: [evalReview, evalGift, evalAttention, evalNavigation, evalCorvinReview, evalCorvinPlanner]
    options:
      cache: false
  typecheck:
    command: npx --no-install tsc --noEmit
    deps: [contracts:generate]
    inputs: ['packages/**/*', 'apps/**/*', 'tests/**/*', 'evals/**/*', 'scripts/**/*', 'lore/gm_prompts/**/*', 'tsconfig.json', 'package.json', 'package-lock.json']
  test:
    command: node --experimental-ffi --import tsx --import ./scripts/test-logging.ts --test tests/*.test.ts
    options:
      cache: false
    deps: [contracts:generate]
    inputs: ['packages/**/*', 'apps/**/*', 'tests/**/*', 'evals/**/*', 'scripts/**/*', 'content/**/*', 'lore/**/*', 'package.json', 'package-lock.json']
  compile:
    command: npx --no-install tsx scripts/compile.ts
    deps: [contracts:generate]
    inputs: ['packages/**/*', 'apps/**/*', 'tests/**/*', 'evals/**/*', 'scripts/**/*', 'lore/gm_prompts/**/*', 'tsconfig.json', 'package.json', 'package-lock.json']
    outputs: [dist]
  webBuild:
    deps: [contracts:generate]
    command: npx --no-install vite build
    inputs: ['apps/web/**/*', 'packages/**/*', 'content/**/*', 'lore/gm_prompts/**/*', 'vite.config.ts', 'package.json', 'package-lock.json']
    outputs: ['dist/web']
  build:
    deps: [compile, webBuild]
  check:
    deps: [contracts:lint, typecheck, test]
  dev:
    command: npx --no-install vite
    deps: [contracts:generate]
    inputs: ['apps/**/*', 'packages/**/*', 'content/**/*', 'lore/gm_prompts/**/*', 'package.json', 'package-lock.json']
    options:
      cache: false
      persistent: true
