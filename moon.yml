toolchains:
  default: node
tasks:
  typecheck:
    command: npx --no-install tsc --noEmit
    deps: [contracts:generate]
    inputs: ['packages/**/*', 'apps/**/*', 'tests/**/*', 'tsconfig.json', 'package.json', 'package-lock.json']
  test:
    command: npx --no-install tsx --test tests/contracts.test.ts
    deps: [contracts:generate]
    inputs: ['packages/**/*', 'tests/**/*', 'content/**/*', 'package.json', 'package-lock.json']
  compile:
    command: npx --no-install tsc --outDir dist
    deps: [contracts:generate]
    inputs: ['packages/**/*', 'apps/**/*', 'tests/**/*', 'tsconfig.json', 'package.json', 'package-lock.json']
    outputs: [dist]
  webBuild:
    command: npx --no-install vite build
    inputs: ['apps/web/**/*', 'vite.config.ts', 'package.json', 'package-lock.json']
    outputs: ['dist/web']
  build:
    deps: [compile, webBuild]
  check:
    deps: [contracts:lint, typecheck, test]
  renderContexts:
    command: npx --no-install tsx scripts/render-dialogue-contexts.ts /tmp/kingmaker-openrouter-contexts
    deps: [contracts:generate]
    inputs: ['scripts/**/*', 'content/**/*', 'packages/core/**/*', 'packages/contracts/**/*']
    options:
      cache: false
  dev:
    command: npx --no-install concurrently --kill-others --names server,web "env KINGMAKER_DEV_STATE_FILE=.moon/cache/dev-state.json npx --no-install tsx watch apps/server/src/index.ts" "npx --no-install vite"
    deps: [contracts:generate]
    inputs: ['apps/**/*', 'packages/**/*', 'content/**/*', 'package.json', 'package-lock.json']
    options:
      cache: false
      persistent: true
