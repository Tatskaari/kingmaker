name: Check and build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Agents run only affected tests locally; the affected suite runs here.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          # Moon diffs against the base revision to find affected tasks.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 26.9.0
          cache: npm
      - uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true
      - run: npm ci
      - name: Restore Moon cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .moon/cache/hashes
            .moon/cache/outputs
          key: moon-${{ runner.os }}-${{ github.sha }}
          restore-keys: moon-${{ runner.os }}-
      - run: proto run moon -- ci workspace:check workspace:build
        env:
          MOON_BASE: >-
            ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref)
            || github.event_name == 'push' && github.event.before
            || 'HEAD~1' }}
      # Save even when a task fails so passing tasks stay cached for the next run.
      - name: Save Moon cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            .moon/cache/hashes
            .moon/cache/outputs
          key: moon-${{ runner.os }}-${{ github.sha }}
