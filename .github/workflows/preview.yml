name: Build PR preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: read

concurrency:
  group: preview-${{ github.event.number }}
  cancel-in-progress: false

jobs:
  build:
    # The site as Pages publishes it (npm run build:site, hosts/web/build-site.ts): the pitch, the roadmap,
    # and the game at play/, the page with no server (the simulation and the AI service in a Web Worker
    # over IndexedDB; the player's own OpenRouter key, or the fake GM).
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 26.9.0
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build:site
      - uses: actions/upload-artifact@v4
        with:
          name: pr-preview
          path: dist/site
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    if: >-
      always() && !cancelled() &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (needs.build.result == 'success' || github.event.action == 'closed')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/download-artifact@v4
        if: github.event.action != 'closed'
        with:
          name: pr-preview
          path: dist/site
      # Store previews and post the stable QA link. pages.yml publishes the
      # combined site after this run; branch-based Pages publishing is not used.
      - uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9 # v1
        id: preview
        with:
          source-dir: dist/site
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          qr-code: false
          wait-for-pages-deployment: false
      # The game's own links. The header is the one the /v2/ link had, so a PR that had it gets this in its place.
      - name: Link the game in the PR
        if: github.event.action != 'closed'
        uses: marocchino/sticky-pull-request-comment@67d0dec7b07ed060a405f9b2a64b8ab319fdd7db # v2.9.2, the pin pr-preview-action uses
        with:
          header: pr-preview-v2
          message: |
            Play it in the browser (no server: your OpenRouter key, or the fake GM): ${{ steps.preview.outputs.preview-url }}play/ (or straight to the fake GM: ${{ steps.preview.outputs.preview-url }}play/?fake)
