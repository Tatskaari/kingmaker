syntax = "proto3";

package kingmaker.v2;

import "google/protobuf/struct.proto";
import "kingmaker/v1/game.proto";

// A document reference, resolved without loading the target's contents.
message DocumentLink {
  string target = 1;
  // Original Markdown destination, including any heading fragment.
  string source = 2;
}

// Authored scenario mechanics. Absent fields mean not authored, not empty state.
message CharacterProperties {
  kingmaker.v1.DndCharacter dnd = 1;
  kingmaker.v1.Inventory inventory = 2;
}

// Mutable playthrough lore. Frontmatter includes the authored access metadata.
message Document {
  google.protobuf.Struct frontmatter = 1;
  string body = 2;
  // Derived from body; rebuild after editing Markdown links.
  repeated DocumentLink links = 3;
  // GM-only sidecar data; never exposed merely because the body is readable.
  CharacterProperties character_properties = 4;
}

// Per-instance playthrough state, separate from shared lore and physical placement.
message RuntimeCharacter {
  string id = 1;
  string character_id = 2;
  string document = 3;
  optional string activity = 4;
  optional string wait = 5;
  uint32 intent_revision = 6;
}

// Physical simulation state, independent of the AI service's document contents.
message SimulationState {
  kingmaker.v1.WorldState map = 1;
  map<string, RuntimeCharacter> runtime_characters = 2;
}

// Authoritative GM state, not a character prompt or a grant to read every doc.
message WorldState {
  // Keys and references are case-sensitive, vault-relative Markdown paths.
  map<string, Document> docs = 1;
  repeated string characters = 2;
  string scenario = 3;
  reserved 4, 7;
  reserved "map", "runtime_characters";
  SimulationState simulation = 8;
  // Author/GM navigation, separate from the scenario briefing entrypoint.
  string scenario_index = 5;
  // Player's Markdown entrypoint; absent until the player has been created.
  optional string player = 6;
}
