syntax = "proto3";

package kingmaker.v1;

import "google/protobuf/struct.proto";

// Pixel coordinates are relative to the top-left corner of a map tile.
message PixelBounds {
  sint32 x = 1;
  sint32 y = 2;
  uint32 width = 3;
  uint32 height = 4;
}

message TileBounds {
  uint32 x = 1;
  uint32 y = 2;
  uint32 width = 3;
  uint32 height = 4;
}

message Tileset {
  string id = 1;
  string image_path = 2;
  uint32 tile_width = 3;
  uint32 tile_height = 4;
  uint32 columns = 5;
  uint32 tile_count = 6;
}

// A tile owns an ordered stack of layers. Each layer draws one tileset sprite
// into its bounds and carries the physical properties of that rendered part.
message TileLayer {
  string tileset_id = 1;
  // Zero-based sprite index within the tileset.
  uint32 tile_id = 2;
  PixelBounds bounds = 3;
  bool solid = 4;
  bool interactable = 5;
  google.protobuf.Struct properties = 6;
}

message Tile {
  // Drawn in order, with the last layer on top.
  repeated TileLayer layers = 1;
}

message MapRoom {
  string id = 1;
  string name = 2;
  repeated TileBounds regions = 3;
}

message WorldMap {
  string id = 1;
  string name = 2;
  uint32 width = 3;
  uint32 height = 4;
  uint32 tile_width = 5;
  uint32 tile_height = 6;
  repeated Tileset tilesets = 7;
  // Row-major and exactly width * height entries long.
  repeated Tile tiles = 8;
  repeated MapRoom rooms = 9;
}

// Authored prose from this character's point of view. It may be unfair,
// incomplete, or changed by later events.
message Relationship {
  string character_id = 1;
  string description = 2;
}

// The dialogue model may replace current_goal. Jev receives it verbatim when
// choosing the character's next action.
message Character {
  string id = 1;
  string name = 2;
  string lore = 3;
  repeated Relationship relationships = 4;
  string current_goal = 5;
  // Authored long-term ambition names, used to initialize parked_objectives
  // for a new game; runtime state leaves this empty.
  repeated string objectives = 6;
  string gender = 7;
  optional uint32 sprite = 8;
  string delegation = 9;
  // The durable undertaking pursued across immediate goals; absent means none.
  ActiveObjective active_objective = 10;
  // Inactive undertakings retain their last known plan and definition of done.
  repeated ActiveObjective parked_objectives = 11;
  // What this character currently hopes to reveal, learn, or elicit through
  // conversation, in priority order. These guide roleplay and are not sent to
  // the action planner.
  repeated string dialogue_objectives = 12;
  Inventory inventory = 13;
  DndCharacter dnd = 14;
}

// Persistent build inputs and resources, not calculated sheet totals.
// Rules IDs identify entries in a versioned content pack; Kingmaker IDs stay local.
message DndCharacter {
  string ruleset_id = 1;
  string species_id = 2;
  string background_id = 3;
  AbilityScores ability_scores = 4;
  repeated ClassLevel classes = 5;
  repeated string feat_ids = 6;
  repeated Proficiency proficiencies = 7;
  repeated CharacterChoice choices = 8;
  HitPoints hit_points = 9;
  uint32 experience = 10;
  uint32 exhaustion = 11;
  bool heroic_inspiration = 12;
  repeated CharacterResource resources = 13;
  SpellcastingState spellcasting = 14;
  repeated AppliedCondition conditions = 15;
  DeathSaves death_saves = 16;
  repeated string weapon_mastery_ids = 17;
}

message AbilityScores {
  uint32 strength = 1;
  uint32 dexterity = 2;
  uint32 constitution = 3;
  uint32 intelligence = 4;
  uint32 wisdom = 5;
  uint32 charisma = 6;
}

message ClassLevel {
  string class_id = 1;
  string subclass_id = 2;
  uint32 level = 3;
  uint32 hit_dice_remaining = 4;
}

enum ProficiencyKind {
  PROFICIENCY_KIND_UNSPECIFIED = 0;
  PROFICIENCY_KIND_SKILL = 1;
  PROFICIENCY_KIND_SAVING_THROW = 2;
  PROFICIENCY_KIND_TOOL = 3;
  PROFICIENCY_KIND_WEAPON = 4;
  PROFICIENCY_KIND_ARMOR = 5;
  PROFICIENCY_KIND_LANGUAGE = 6;
}

enum ProficiencyRank {
  PROFICIENCY_RANK_UNSPECIFIED = 0;
  PROFICIENCY_RANK_PROFICIENT = 1;
  PROFICIENCY_RANK_EXPERTISE = 2;
}

// Explicit selections/grants only. Automatic rules grants are derived, not copied.
message Proficiency {
  ProficiencyKind kind = 1;
  string target_id = 2;
  ProficiencyRank rank = 3;
  string source_id = 4;
}

// Retains build choices (including ability increases), without an event log.
// An adapter resolves these stable option IDs against the chosen rules content.
message CharacterChoice {
  string source_id = 1;
  string choice_id = 2;
  repeated string selected_option_ids = 3;
}

message HitPoints {
  sint32 current = 1;
  uint32 maximum = 2;
  uint32 temporary = 3;
  sint32 maximum_bonus = 4;
}

message DeathSaves {
  uint32 successes = 1;
  uint32 failures = 2;
  bool stable = 3;
}

enum ResourceRecharge {
  RESOURCE_RECHARGE_UNSPECIFIED = 0;
  RESOURCE_RECHARGE_SHORT_REST = 1;
  RESOURCE_RECHARGE_LONG_REST = 2;
  RESOURCE_RECHARGE_DAWN = 3;
}

message CharacterResource {
  string resource_id = 1;
  uint32 current = 2;
  uint32 maximum = 3;
  ResourceRecharge recharge = 4;
}

message SpellcastingState {
  repeated string known_spell_ids = 1;
  repeated string prepared_spell_ids = 2;
  map<uint32, uint32> slots_used = 3;
  uint32 pact_slots_used = 4;
  repeated string used_free_cast_spell_ids = 5;
  string concentration_effect_id = 6;
}

message AppliedCondition {
  string id = 1;
  string condition_id = 2;
  string source_character_id = 3;
  string source_effect_id = 4;
  optional uint32 level = 5;
  optional uint32 expires_on_round = 6;
}

// Each item occurs in exactly one inventory; equipment refers to those same IDs.
message Inventory {
  repeated ItemInstance items = 1;
  Equipment equipment = 2;
}

message Equipment {
  string main_hand_item_id = 1;
  string off_hand_item_id = 2;
  string armor_item_id = 3;
  string shield_item_id = 4;
  repeated string attuned_item_ids = 5;
}

message ItemInstance {
  string id = 1;
  string name = 2;
  string details = 3;
  bool concealed = 4;
  // Absent for narrative props without a mechanical rules definition.
  string definition_id = 5;
  optional uint32 quantity = 6;
  optional uint32 charges_remaining = 7;
  optional uint32 maximum_charges = 8;
  repeated string identified_by_character_ids = 9;
  // Additional authored non-mechanical metadata.
  google.protobuf.Struct properties = 10;
}

message ActiveObjective {
  string name = 1;
  // Current knowledge, progress, obstacles and the remaining execution plan.
  string status = 2;
  string success_criteria = 3;
  // Mirrors Character.current_goal for compatibility with the action planner.
  string current_goal = 4;
}

enum NoteVisibility {
  NOTE_VISIBILITY_UNSPECIFIED = 0;
  NOTE_VISIBILITY_PUBLIC = 1;
  NOTE_VISIBILITY_PRIVATE = 2;
}

// Free-form durable memory from one or more characters' points of view.
message Note {
  string id = 1;
  uint32 day = 2;
  string text = 3;
  repeated string character_ids = 5;
  NoteVisibility visibility = 6;
  google.protobuf.Struct details = 7;
}

// A transient occurrence in the physical world. Events are perceived and
// processed into character notes/objective changes rather than stored as memory.
message Event {
  string id = 1;
  uint32 day = 2;
  string kind = 3;
  string summary = 4;
  repeated string participant_ids = 5;
  TilePosition position = 6;
  google.protobuf.Struct details = 7;
}

message Room {
  string id = 1;
  string name = 2;
  string description = 3;
  repeated string exit_room_ids = 4;
  reserved 5;
  reserved "search_spots";
  Inventory inventory = 8;
  bool private = 6;
  repeated string allowed_character_ids = 7;
}

// Integer tile coordinates on the palace map.
message TilePosition {
  uint32 x = 1;
  uint32 y = 2;
}

// Authored placement for a scenario transition, such as entering court.
message ActorPlacement {
  string character_id = 1;
  string room_id = 2;
  TilePosition position = 3;
}

message ActorState {
  // Distinguishes stationary background bodies sharing one character identity.
  optional string instance_id = 6;
  // Per-body intent. Authored Markdown references seed these only on scene creation.
  optional string activity = 7;
  optional string wait = 8;
  uint32 intent_revision = 9;
  string character_id = 1;
  string home_room_id = 2;
  string room_id = 3;
  bool awake = 4;
  TilePosition position = 5;
}

// The authoritative state contains every room, fixture and object. Before model
// calls, concealed contents and undiscovered fixture details are removed unless known by
// that character. Facts remain flexible for incidental scenario state.
message DoorState {
  string id = 1;
  string name = 2;
  repeated TilePosition tiles = 3;
  repeated TilePosition interaction_spots = 4;
  repeated string room_ids = 5;
  bool open = 6;
}

// Physical map furniture; contents live in its inventory.
message MapFixture {
  string id = 1;
  string name = 2;
  string room_id = 3;
  TilePosition position = 4;
  TilePosition interaction_spot = 5;
  uint32 sprite = 6;
  bool container = 7;
  bool open = 8;
  string required_key_id = 9;
  string revealed_name = 10;
  repeated string examined_by = 11;
  repeated string searched_by = 12;
  string owner_character_id = 13;
  Inventory inventory = 14;
}

message WorldState {
  uint32 revision = 1;
  uint32 day = 2;
  reserved 3;
  reserved "solstice_day";
  repeated Room rooms = 4;
  repeated ActorState actors = 5;
  reserved 6;
  reserved "objects";
  google.protobuf.Struct facts = 7;
  GamePhase phase = 8;
  repeated DoorState doors = 9;
  repeated MapFixture fixtures = 10;
}

enum GamePhase {
  GAME_PHASE_UNSPECIFIED = 0;
  GAME_PHASE_PLAYER_CREATION = 1;
  GAME_PHASE_CONVERSATIONS = 2;
  reserved 3, 4, 5;
  reserved "GAME_PHASE_NIGHT_ACTIONS", "GAME_PHASE_SOLSTICE", "GAME_PHASE_RESOLVED";
}

message Scenario {
  string id = 1;
  string system_prompt = 2;
  string premise = 3;
  string game_master_prompt = 4;
  repeated Character characters = 5;
  repeated Note notes = 6;
  WorldState world = 7;
  optional string player_character_id = 8;
  repeated ActorPlacement court_arrival_placements = 9;
}

enum TranscriptRole {
  TRANSCRIPT_ROLE_UNSPECIFIED = 0;
  TRANSCRIPT_ROLE_PLAYER = 1;
  TRANSCRIPT_ROLE_CHARACTER = 2;
  TRANSCRIPT_ROLE_OTHER_CHARACTER = 3;
  TRANSCRIPT_ROLE_GAME_MASTER = 4;
}

message TranscriptMessage {
  TranscriptRole role = 1;
  string speaker_id = 2;
  string text = 3;
}

message DialogueRequest {
  string character_id = 1;
  Scenario scenario = 2;
  repeated TranscriptMessage transcript = 3;
}

message GoalUpdate {
  string goal = 1;
  string reason = 2;
}

// Durable NPC memory extracted once from a completed conversation or perceived event.
message ConversationMemory {
  repeated string new_notes = 1;
  optional GoalUpdate goal_update = 2;
  repeated Relationship relationships = 3;
  optional string lore = 4;
}

message RelationshipUpdate {
  string owner_character_id = 1;
  Relationship relationship = 2;
}

// Once the interview has enough material, the game master creates the player
// and describes how each existing character initially understands them.
message PlayerSetup {
  Character player = 1;
  repeated RelationshipUpdate npc_relationships = 2;
  string homeland = 3;
  string embassy_role = 4;
}

message GameMasterRequest {
  Scenario scenario = 1;
  repeated TranscriptMessage transcript = 2;
}
